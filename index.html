<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Frigo VR</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    const composants = [
      "Compresseur",
      "Condenseur",
      "Detendeur",
      "Evaporateur"
    ];

    let etape = 0;
    let erreurs = 0;

    function message(texte) {
      document.querySelector("#consigne")
        .setAttribute("value", texte);
    }

    function question() {
      message(
        "Selectionne : " + composants[etape] +
        "\nEtape " + (etape + 1) + "/4" +
        " | Erreurs : " + erreurs
      );
    }

    AFRAME.registerComponent("atelier", {
      init: function () {
        question();
      }
    });

    AFRAME.registerComponent("choisir", {
      schema: { type: "int" },

      init: function () {
        this.el.addEventListener("click", () => {
          if (etape >= composants.length) return;

          if (this.data === etape) {
            this.el.setAttribute("color", "#22c55e");
            etape++;

            if (etape === composants.length) {
              message(
                "Bravo ! Exercice termine.\n" +
                "Erreurs : " + erreurs +
                "\nAppuie sur RECOMMENCER."
              );
            } else {
              question();
            }
          } else {
            erreurs++;
            message(
              "Essaie encore !\nSelectionne : " +
              composants[etape] +
              "\nErreurs : " + erreurs
            );
          }
        });
      }
    });

    AFRAME.registerComponent("recommencer", {
      init: function () {
        this.el.addEventListener("click", () => {
          etape = 0;
          erreurs = 0;

          document.querySelectorAll("[choisir]")
            .forEach((objet) => {
              objet.setAttribute(
                "color",
                objet.getAttribute("data-couleur")
              );
            });

          question();
        });
      }
    });
  </script>
</head>

<body style="margin: 0;">
  <a-scene
    atelier
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .cliquable">

    <a-sky color="#182538"></a-sky>

    <a-entity light="type: ambient; intensity: 0.8">
    </a-entity>
    <a-entity
      light="type: directional; intensity: 1"
      position="2 4 1">
    </a-entity>

    <!-- Sol et mur de l'atelier -->
    <a-plane
      rotation="-90 0 0"
      width="12" height="12"
      color="#475569">
    </a-plane>

    <a-box
      position="0 2 -5"
      width="10" height="4" depth="0.15"
      color="#263449">
    </a-box>

    <!-- Tableau des consignes -->
    <a-plane
      position="0 2.65 -4.8"
      width="5" height="1.3"
      color="#0f172a">
      <a-text
        value="FRIGO VR - ATELIER"
        position="0 0.4 0.02"
        align="center"
        width="4"
        color="#38bdf8">
      </a-text>
      <a-text
        id="consigne"
        position="0 -0.1 0.02"
        align="center"
        width="3.8"
        color="white">
      </a-text>
    </a-plane>

    <!-- Table -->
    <a-box
      position="0 0.65 -3.5"
      width="4.8" height="0.15" depth="1.2"
      color="#64748b">
    </a-box>

    <a-box
      position="-2 0.3 -3.5"
      width="0.15" height="0.6" depth="0.8"
      color="#334155">
    </a-box>

    <a-box
      position="2 0.3 -3.5"
      width="0.15" height="0.6" depth="0.8"
      color="#334155">
    </a-box>

    <!-- Composants simplifies -->
    <a-cylinder
      class="cliquable"
      choisir="0"
      data-couleur="#ef4444"
      position="-1.8 1.1 -3.5"
      radius="0.3" height="0.75"
      color="#ef4444">
    </a-cylinder>

    <a-box
      class="cliquable"
      choisir="1"
      data-couleur="#f97316"
      position="-0.6 1.1 -3.5"
      width="0.75" height="0.75" depth="0.35"
      color="#f97316">
    </a-box>

    <a-sphere
      class="cliquable"
      choisir="2"
      data-couleur="#eab308"
      position="0.6 1.05 -3.5"
      radius="0.3"
      color="#eab308">
    </a-sphere>

    <a-box
      class="cliquable"
      choisir="3"
      data-couleur="#38bdf8"
      position="1.8 1.1 -3.5"
      width="0.75" height="0.75" depth="0.35"
      color="#38bdf8">
    </a-box>

    <!-- Etiquettes -->
    <a-text
      value="Compresseur"
      position="-1.8 1.7 -3.5"
      align="center" width="2">
    </a-text>

    <a-text
      value="Condenseur"
      position="-0.6 1.7 -3.5"
      align="center" width="2">
    </a-text>

    <a-text
      value="Detendeur"
      position="0.6 1.7 -3.5"
      align="center" width="2">
    </a-text>

    <a-text
      value="Evaporateur"
      position="1.8 1.7 -3.5"
      align="center" width="2">
    </a-text>

    <!-- Bouton de remise a zero -->
    <a-plane
      class="cliquable"
      recommencer
      position="0 0.35 -2.7"
      width="1.5" height="0.35"
      color="#2563eb">
      <a-text
        value="RECOMMENCER"
        position="0 0 0.02"
        align="center" width="2">
      </a-text>
    </a-plane>

    <a-text
      value="Prototype pedagogique uniquement"
      position="0 0.08 -2.7"
      align="center" width="2.8"
      color="#fde68a">
    </a-text>

    <!-- Vue et manettes -->
    <a-entity>
      <a-camera
        position="0 1.6 0"
        wasd-controls="enabled: false">
      </a-camera>

      <a-entity
        laser-controls="hand: left"
        raycaster="objects: .cliquable; far: 10">
      </a-entity>

      <a-entity
        laser-controls="hand: right"
        raycaster="objects: .cliquable; far: 10">
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
